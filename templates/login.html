<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Login</title>

    <!-- Same font as signup page -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Reset and base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Main card ── */
        .card {
            display: flex;
            width: 860px;
            min-height: 520px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        /* ── Left side - login form ── */
        .form-side {
            background: #ffffff;
            width: 55%;
            padding: 56px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-side h2 {
            font-size: 26px;
            font-weight: 700;
            color: #111;
            margin-bottom: 10px;
            text-align: center;
        }

        /* small subtitle below heading */
        .form-side p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 32px;
        }

        /* ── Input fields ── */
        .input-group {
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #ccc;
            padding: 10px 4px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #333;
            background: transparent;
            outline: none;
            transition: border-color 0.3s;
        }

        /* highlight when clicked */
        .input-group input:focus {
            border-bottom-color: #7b5ef8;
        }

        .input-group input::placeholder {
            color: #aaa;
            font-size: 13.5px;
        }

        /* ── Login button ── */
        .btn-login {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #7b5ef8, #3bc8f5);
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            opacity: 0.88;
        }

        /* ── Signup link at bottom ── */
        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13.5px;
            color: #666;
        }

        .signup-link a {
            color: #7b5ef8;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* ── Error message box ── */
        .error-msg {
            background: #fff0f0;
            color: #e53e3e;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none; /* hidden until needed */
        }

        /* ── Right side - blue gradient panel ── */
        .info-side {
            width: 45%;
            background: linear-gradient(135deg, #9b59f5 0%, #4e8ef7 55%, #1fd4f5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 36px;
            text-align: center;
            color: white;
        }

        .info-side h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .info-side p {
            font-size: 14.5px;
            font-weight: 300;
            line-height: 1.7;
            opacity: 0.92;
        }

        /* decorative dots - same as signup page */
        .dots {
            display: flex;
            gap: 8px;
            margin-top: 36px;
        }

        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
        }

        .dots span.active {
            background: white;
            width: 24px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ── Left: Login Form ── -->
    <div class="form-side">

        <h2>HR Login</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <!-- Error box - shown if login fails -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Form sends data to /login using POST (safe) -->
        <form action="/login" method="POST" id="loginForm">

            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>

        </form>

        <!-- Link for users who don't have an account yet -->
        <div class="signup-link">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>

    </div>

    <!-- ── Right: Info Panel (same as signup) ── -->
    <div class="info-side">

        <h1>AI Attrition Platform</h1>
        <p>Predict employee attrition and make smarter HR decisions.</p>

        <!-- decorative dots -->
        <div class="dots">
            <span></span>
            <span class="active"></span>
            <span></span>
        </div>

    </div>

</div>

<script>
    // Handle login form submission
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async function(e) {
        e.preventDefault(); // stop normal form submit

        // Collect email and password
        const formData = new FormData(form);

        // Send to /login using fetch
        const response = await fetch("/login", {
            method: "POST",
            body: formData
        });

        // If login worked, Flask redirects to dashboard
        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        // If login failed, show the error message
        if (!response.ok) {
            const data = await response.json();
            const errorBox = document.getElementById("errorMsg");
            errorBox.style.display = "block";
            errorBox.textContent = data.message || "Invalid email or password.";
        }
    });
</script>

</body>
</html>
