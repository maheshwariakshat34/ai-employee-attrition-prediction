<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Sign Up</title>

    <!-- Google Font - clean and readable -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Reset and base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Main card wrapper ── */
        .card {
            display: flex;
            width: 860px;
            min-height: 580px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        /* ── Left side - the form ── */
        .form-side {
            background: #ffffff;
            width: 55%;
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-side h2 {
            font-size: 26px;
            font-weight: 700;
            color: #111;
            margin-bottom: 28px;
            text-align: center;
        }

        /* ── Input fields ── */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #ccc;
            padding: 10px 4px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #333;
            background: transparent;
            outline: none;
            transition: border-color 0.3s;
        }

        /* highlight input when user clicks on it */
        .input-group input:focus {
            border-bottom-color: #7b5ef8;
        }

        .input-group input::placeholder {
            color: #aaa;
            font-size: 13.5px;
        }

        /* ── Register button ── */
        .btn-register {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #7b5ef8, #3bc8f5);
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-register:hover {
            opacity: 0.88;
        }

        /* ── Login link at the bottom ── */
        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            color: #666;
        }

        .login-link a {
            color: #7b5ef8;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* ── Error message box (shown if signup fails) ── */
        .error-msg {
            background: #fff0f0;
            color: #e53e3e;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none; /* hidden by default */
        }

        /* ── Right side - the blue panel ── */
        .info-side {
            width: 45%;
            background: linear-gradient(135deg, #9b59f5 0%, #4e8ef7 55%, #1fd4f5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 36px;
            text-align: center;
            color: white;
        }

        .info-side h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .info-side p {
            font-size: 14.5px;
            font-weight: 300;
            line-height: 1.7;
            opacity: 0.92;
        }

        /* small decorative dots on right panel */
        .dots {
            display: flex;
            gap: 8px;
            margin-top: 36px;
        }

        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
        }

        .dots span.active {
            background: white;
            width: 24px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ── Left: Signup Form ── -->
    <div class="form-side">

        <h2>HR Sign Up</h2>

        <!-- Error message shown if something goes wrong -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- The form sends data to /signup using POST method (safe) -->
        <form action="/signup" method="POST" id="signupForm">

            <div class="input-group">
                <input type="text" name="username" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <input type="text" name="company" placeholder="Company Name">
            </div>

            <div class="input-group">
                <input type="text" name="designation" placeholder="HR Role">
            </div>

            <div class="input-group">
                <input type="text" name="experience" placeholder="Experience (e.g. 3 years)">
            </div>

            <button type="submit" class="btn-register">Register</button>

        </form>

        <!-- Login link for users who already have an account -->
        <div class="login-link">
            Already have an account? <a href="/login">Log In</a>
        </div>

    </div>

    <!-- ── Right: Info Panel ── -->
    <div class="info-side">

        <h1>AI Attrition Platform</h1>
        <p>Predict employee attrition and make smarter HR decisions.</p>

        <!-- small decorative dots -->
        <div class="dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>

<script>
    // Show error message if Flask returns an error response
    const form = document.getElementById("signupForm");

    form.addEventListener("submit", async function(e) {
        e.preventDefault(); // stop normal form submit

        // Collect all form values
        const formData = new FormData(form);

        // Send form to /signup using fetch
        const response = await fetch("/signup", {
            method: "POST",
            body: formData
        });

        // If signup worked, Flask will redirect — follow it
        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        // If something went wrong, show the error message
        if (!response.ok) {
            const data = await response.json();
            const errorBox = document.getElementById("errorMsg");
            errorBox.style.display = "block";
            errorBox.textContent = data.message || "Something went wrong. Please try again.";
        }
    });
</script>

</body>
</html>
